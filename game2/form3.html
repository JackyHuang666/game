<style>

.pad.p0{background:var(--sq1);color:var(--sq1-fg)} .pad.p1{background:var(--sq2);color:var(--sq2-fg)}
.pad.p2{background:var(--sq3);color:var(--sq3-fg)} .pad.p3{background:var(--sq4);color:var(--sq4-fg)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5em,1fr));gap:.7em;margin:.8em 0}

@media (max-width:480px){.grid2.stack{grid-template-columns:1fr}}

<script>
(function(){
'use strict';
const KEY='jingxin-siji-v2';
const store={days:{},level:{},settings:{size:'m',sound:true,voice:false,music:false}};
try{
  const s0=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('jingxin-siji-v1'));
  if(s0){
    store.days=s0.days||{};store.level=s0.level||{};
    Object.assign(store.settings,s0.settings||{});
    if(s0.settings&&s0.settings.xl&&!s0.settings.size)store.settings.size='xl';
  }
}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function applySize(){const s=store.settings.size;if(s==='xl'||s==='tv')document.documentElement.setAttribute('data-size',s);else document.documentElement.removeAttribute('data-size');}
applySize();
let REDUCE=false;try{REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

/* ---------- levels ---------- */
const LV=['輕鬆','適中','進階'];
const getLv=k=>store.level[k]||1;
const setLv=(k,v)=>{store.level[k]=Math.max(1,Math.min(3,v));persist();};

/* ---------- modules and modes ---------- */
const MODS={
  body:{ch:'身',name:'呼吸與伸展',desc:'坐著或扶著椅子，慢慢呼吸、活動身體',c:'--c-body'},
  mind:{ch:'心',name:'覺察與感恩',desc:'看看心情、放鬆身體、想想感謝的事',c:'--c-mind'},
  brain:{ch:'腦',name:'記憶與專注',desc:'燈號記憶、節慶配對、記物品',c:'--c-brain'},
  cog:{ch:'知',name:'思考與判斷',desc:'節慶、健康生活小問答和排步驟',c:'--c-cog'}
};
const ORDER=['body','mind','brain','cog'];
const MODES={
  body:[
    {id:'sit',ch:'坐',name:'坐著伸展',desc:'坐在椅子上，呼吸並活動上半身'},
    {id:'stand',ch:'站',name:'扶椅站立',desc:'一手扶著椅背，活動雙腳和身體'},
    {id:'breath',ch:'息',name:'只做呼吸',desc:'跟著圓圈慢慢呼吸，最輕鬆'}],
  mind:[
    {id:'weather',ch:'晴',name:'心情天氣',desc:'看看今天的心情，做幾次慢呼吸'},
    {id:'scan',ch:'掃',name:'身體掃描',desc:'從頭到腳，一處一處放鬆'},
    {id:'thanks',ch:'謝',name:'感恩時刻',desc:'想一想今天值得感謝的事'}],
  brain:[
    {id:'seq',ch:'燈',name:'燈號記憶',desc:'記住燈亮的順序，再照順序按'},
    {id:'match',ch:'配',name:'節慶配對',desc:'把節慶和它的食物或習俗配成一對'},
    {id:'items',ch:'物',name:'記物品',desc:'看一看有哪些東西，再把它們找出來'}],
  cog:[
    {id:'fest',ch:'節',name:'節慶問答',desc:'端午、中秋、過年的小常識'},
    {id:'health',ch:'康',name:'健康生活',desc:'日常保健與生活小常識'},
    {id:'order',ch:'序',name:'排排看',desc:'把做事的步驟照順序排好'}]
};

/* ---------- days ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayRec(d){return store.days[ymd(d)]||{};}
function hasAny(d){return Object.keys(dayRec(d)).length>0;}
function streak(){const d=new Date();let n=0;if(!hasAny(d))d.setDate(d.getDate()-1);while(hasAny(d)){n++;d.setDate(d.getDate()-1);}return n;}
function markDone(k){const key=ymd(new Date());store.days[key]=store.days[key]||{};if(!store.days[key][k]){store.days[key][k]=true;persist();}}

/* ---------- sound ---------- */
let ac=null,music=null,gesture=false;
function ctx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}
function tone(f,dur,vol){
  if(!store.settings.sound||!f)return;dur=dur||.4;vol=vol||.1;
  try{const c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.05);}catch(e){}
}

/* ---------- soundscapes: one per play mode, all synthesized ---------- */
const nbuf={};
function noiseBuf(c,kind){
  if(nbuf[kind]&&nbuf[kind].sampleRate===c.sampleRate)return nbuf[kind];
  const len=c.sampleRate*4,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  if(kind==='brown'){let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}}
  else if(kind==='pink'){let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;
      b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}}
  else for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  nbuf[kind]=b;return b;
}
function nsrc(c,R,kind){const s=c.createBufferSource();s.buffer=noiseBuf(c,kind);s.loop=true;s.start(0,Math.random()*3);R.s.push(s);return s;}
function osc(c,R,type,f){const o=c.createOscillator();o.type=type;o.frequency.value=f;o.start();R.s.push(o);return o;}
function filt(c,type,f,q){const n=c.createBiquadFilter();n.type=type;n.frequency.value=f;if(q)n.Q.value=q;return n;}
function gain(c,v){const g=c.createGain();g.gain.value=v;return g;}
function lfo(c,R,rate,depth,param){const o=osc(c,R,'sine',rate),g=gain(c,depth);o.connect(g);g.connect(param);}
function every(R,ms,fn){R.i.push(setInterval(fn,ms));}
function after(R,ms,fn){R.i.push(setTimeout(fn,ms));}
function ping(c,out,type,f,vol,att,dec,f2){
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+att+dec);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+att+dec+.1);
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const clampI=(i,n)=>Math.max(0,Math.min(n-1,i));
const SC={
  pad:{name:'柔和長音',build(c,out,R){
    [130.8,196,261.6,329.6,392].forEach((f,i)=>{const o=osc(c,R,'sine',f*(1+(i-2)*.0007)),g=gain(c,.03);o.connect(g);g.connect(out);lfo(c,R,.05+i*.013,.02,g.gain);});
    const n=nsrc(c,R,'brown'),lp=filt(c,'lowpass',300),g=gain(c,.04);n.connect(lp);lp.connect(g);g.connect(out);
  }},
  ocean:{name:'海浪聲',build(c,out,R){
    const n=nsrc(c,R,'pink'),lp=filt(c,'lowpass',500,.7),g=gain(c,.16);n.connect(lp);lp.connect(g);g.connect(out);
    lfo(c,R,.1,.13,g.gain);lfo(c,R,.1,350,lp.frequency);
    const n2=nsrc(c,R,'white'),hp=filt(c,'highpass',3000),g2=gain(c,.02);n2.connect(hp);hp.connect(g2);g2.connect(out);lfo(c,R,.1,.018,g2.gain);
  }},
  stream:{name:'溪水聲',build(c,out,R){
    const n=nsrc(c,R,'white'),bp=filt(c,'bandpass',1900,.7),g=gain(c,.2);n.connect(bp);bp.connect(g);g.connect(out);
    const n2=nsrc(c,R,'white'),bp2=filt(c,'bandpass',900,2),g2=gain(c,.2);n2.connect(bp2);bp2.connect(g2);g2.connect(out);
    lfo(c,R,.6,380,bp2.frequency);lfo(c,R,.23,.1,g2.gain);
    every(R,260,()=>{if(c.state==='running'&&Math.random()<.5){const f=500+Math.random()*900;ping(c,out,'sine',f,.018,.004,.07,f*2);}});
  }},
  wind:{name:'風聲',build(c,out,R){
    const n=nsrc(c,R,'pink'),bp=filt(c,'bandpass',520,1.1),g=gain(c,.4);n.connect(bp);bp.connect(g);g.connect(out);
    lfo(c,R,.07,260,bp.frequency);lfo(c,R,.05,.2,g.gain);
  }},
  rain:{name:'雨聲',build(c,out,R){
    const n=nsrc(c,R,'white'),hp=filt(c,'highpass',1400),lp=filt(c,'lowpass',7500),g=gain(c,.09);n.connect(hp);hp.connect(lp);lp.connect(g);g.connect(out);
    const b=nsrc(c,R,'pink'),l2=filt(c,'lowpass',700),g2=gain(c,.12);b.connect(l2);l2.connect(g2);g2.connect(out);
    every(R,200,()=>{if(c.state==='running'&&Math.random()<.45)ping(c,out,'sine',1800+Math.random()*1800,.012,.002,.04);});
  }},
  bowl:{name:'頌缽聲',build(c,out,R){
    const strike=()=>{if(c.state!=='running')return;const f=rnd([196,220,247]);
      [[1,.16,9],[2.71,.06,6],[5.4,.02,3.5]].forEach(p=>ping(c,out,'sine',f*p[0],p[1],.02,p[2]));};
    after(R,700,strike);every(R,9500,strike);
  }},
  musicbox:{name:'音樂盒',build(c,out,R){
    const notes=[523,587,659,784,880,1047];let idx=2;
    every(R,950,()=>{if(c.state!=='running'||Math.random()<.25)return;idx=clampI(idx+rnd([-2,-1,-1,0,1,1,2]),notes.length);
      const f=notes[idx];ping(c,out,'sine',f,.05,.005,1.6);ping(c,out,'sine',f*2,.012,.005,.8);});
  }},
  forest:{name:'森林鳥鳴',build(c,out,R){

  guzheng:{name:'古箏',build(c,out,R){
    const sc=[196,220,262,294,330,392,440,523,588,659];
    const pl=(f,v)=>{const t=c.currentTime,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),lp=filt(c,'lowpass',2400),g2=gain(c,.3);
      o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
      o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(out);o.start(t);o2.start(t);o.stop(t+2.3);o2.stop(t+2.3);};
    let i=3;
    every(R,1300,()=>{
      if(c.state!=='running'||Math.random()<.2)return;
      if(Math.random()<.3){
        const up=Math.random()<.6,k=4+Math.floor(Math.random()*3);
        for(let j=0;j<k;j++){const ix=clampI(i+(up?j:-j),sc.length);setTimeout(()=>{if(c.state==='running')pl(sc[ix],.08);},j*140);}
        i=clampI(i+(up?k:-k),sc.length);
      }else{i=clampI(i+rnd([-2,-1,0,1,2]),sc.length);pl(sc[i],.09);}
    });
  }},
  fire:{name:'營火聲',build(c,out,R){
    const n=nsrc(c,R,'brown'),lp=filt(c,'lowpass',450),g=gain(c,.22);n.connect(lp);lp.connect(g);g.connect(out);lfo(c,R,.4,.05,g.gain);
    const crack=()=>{if(c.state!=='running')return;const s=c.createBufferSource();s.buffer=noiseBuf(c,'white');
      const bp=filt(c,'bandpass',1500+Math.random()*3500,1.5),cg=c.createGain(),t=c.currentTime,d=.02+Math.random()*.05;

  flute:{name:'竹笛',build(c,out,R){
    const sc=[392,440,523,588,659,784];let i=2;
    const note=()=>{if(c.state!=='running')return;i=clampI(i+rnd([-2,-1,0,1,2]),sc.length);

      o.type='sine';o.frequency.value=f;v.frequency.value=5;vg.gain.value=3;v.connect(vg);vg.connect(o.frequency);
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.065,t+.35);g.gain.setValueAtTime(.065,t+d-.7);g.gain.linearRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(out);o.start(t);v.start(t);o.stop(t+d+.1);v.stop(t+d+.1);

  crickets:{name:'夜晚蟲鳴',build(c,out,R){

function fadeOut(m){
  m.R.i.forEach(id=>{clearInterval(id);clearTimeout(id);});
  try{const t=ac.currentTime;m.out.gain.cancelScheduledValues(t);m.out.gain.setValueAtTime(Math.max(.0001,m.out.gain.value),t);m.out.gain.exponentialRampToValueAtTime(.0001,t+1.2);}catch(e){}
  setTimeout(()=>{m.R.s.forEach(s=>{try{s.stop();}catch(e){}});try{m.out.disconnect();}catch(e){}},1500);
}

}

function phaseRun(r,p){
  if(r>rounds()){
    if(G.mode==='breath'){advance('done');}else{G.mi=0;G.reps=0;advance('moves');}
    return;
  }
  const PH=phases(),ph=PH[p],orb=$('orb');if(!orb)return;
  $('stepTxt').textContent='第 '+r+' / '+rounds()+' 輪';
  $('phase').textContent=ph.t;
  orb.style.transition=REDUCE?'none':'transform '+ph.s+'s ease-in-out';
  orb.style.transform='scale('+ph.k+')';
  tone(ph.f,.8,.08);speak(ph.say);
  $('count').textContent=ph.s;
  for(let i=1;i<=ph.s;i++)later(()=>{
    if(i<ph.s)$('count').textContent=ph.s-i;
    else if(p+1<PH.length)phaseRun(r,p+1);
    else phaseRun(r+1,0);
  },i*1000);
}

      return shell('mind','第 2 / 2 步','<div class="card"><p style="margin:0">「'+WEATHER[G.w].k+'」。'+WEATHER[G.w].m+'</p></div>'+
        '<div class="card" style="margin-top:.8em"><p style="margin-top:0">請做 '+n+' 次慢呼吸：慢慢吸氣，再慢慢吐氣。每做完一次，就按一下。</p>'+dotsHTML(n,G.n)+'</div>'+
        '<button class="btn wide" data-act="'+(done?'mNext':'mBreath')+'">'+(done?'完成':'我做了一次慢呼吸')+'</button>');
    }
    return doneCard('mind','您今天的心情是「'+WEATHER[G.w].k+'」，也慢慢呼吸了 '+G.n+' 次。把這份平靜帶著，接下來的時間會更輕鬆。',true);
  }
  if(G.mode==='scan'){
    if(G.step==='go'){
      const idx=SCAN_IDX[getLv(G.key)],p=SCAN[idx[G.i]],last=G.i===idx.length-1;
      return shell('mind','第 '+(G.i+1)+' / '+idx.length+' 處',
        '<div class="orb"><div class="ring"></div><div class="core pulse" id="orb"></div></div>'+
        '<div class="card" style="margin-top:.8em"><h3>'+p.n+'</h3><p style="margin:0">'+p.t+'</p></div>'+
        '<p class="muted center">圓圈慢慢變大時吸氣，變小時吐氣。準備好了再按下一處。</p>'+
        '<button class="btn wide" data-act="sNext">'+(last?'完成':'好了，下一處')+'</button>');
    }
    return doneCard('mind','從頭到腳都放鬆過一遍了。',true);
  }
  if(G.step==='pick'){
    const need=getLv(G.key);
    const t=THANKS.map((x,i)=>'<button class="opt" data-act="mT" data-v="'+i+'" aria-pressed="'+(G.t.indexOf(i)>=0)+'">'+x+'</button>').join('');
    return shell('mind','選 '+need+' 件以上','<div class="card"><p style="margin:0">今天有哪些人事物，值得說一聲謝謝？請選至少 '+need+' 個，並在心裡對它們說謝謝。</p></div>'+
      '<div class="grid2 stack">'+t+'</div><button class="btn wide" data-act="mNext"'+(G.t.length>=need?'':' disabled')+'>完成</button>');
  }
  return doneCard('mind','您感謝了「'+G.t.map(i=>THANKS[i]).join('、')+'」。把這份感謝帶著，心會更踏實。',true);
}

/* ---------- 腦：燈號記憶 ---------- */
const PADS=[{n:'紅',f:262},{n:'黃',f:330},{n:'藍',f:392},{n:'綠',f:523}];
const SEQ_ROUNDS=5;
function newSeq(){const s=[];for(let i=0;i<G.len;i++)s.push(Math.floor(Math.random()*4));G.seq=s;G.pos=0;}
function padsHTML(live){return '<div class="pads'+(live?' live':'')+'">'+PADS.map((p,i)=>'<button class="pad p'+i+'" id="pad'+i+'" data-act="pad" data-v="'+i+'">'+p.n+'</button>').join('')+'</div>';}
function viewSeq(){
  if(G.step==='intro')return shell('brain','準備','<div class="card"><p style="margin:0">四個顏色會依序亮起。請記住順序，等燈亮完，再照同樣的順序按一按。</p>'+
    '<ul class="plain"><li>共 '+SEQ_ROUNDS+' 回合，順序會依您的表現調整長短</li><li>按錯沒關係，可以再看一次</li><li>沒有時間限制</li></ul></div><button class="btn wide" data-act="brStart">開始</button>');
  if(G.step==='done')return doneCard('brain','您完成了 '+SEQ_ROUNDS+' 個回合，最長記住了 '+G.best+' 個順序。');
  const head='第 '+(G.round+1)+' / '+SEQ_ROUNDS+' 回合';
  if(G.step==='watch')return shell('brain',head,'<p class="status">請看，記住燈亮的順序（共 '+G.seq.length+' 個）</p>'+padsHTML(false));
  if(G.step==='input'||G.step==='lock')return shell('brain',head,'<p class="status" id="st">輪到您了，請照順序按（已按 '+G.pos+' / '+G.seq.length+'）</p>'+padsHTML(G.step==='input'));
  if(G.step==='ok')return shell('brain',head,'<p class="status">答對了！記得很清楚。</p>'+padsHTML(false)+
    '<button class="btn wide" data-act="brNext">'+(G.round===SEQ_ROUNDS-1?'完成':'下一回合')+'</button>');
  const skip=G.fails>=2;
  return shell('brain',head,'<p class="status">'+(skip?'沒關係，我們換短一點的。':'差一點，沒關係。我們再看一次。')+'</p>'+padsHTML(false)+
    '<button class="btn wide" data-act="'+(skip?'brSkip':'brAgain')+'">'+(skip?'換一題':'再看一次')+'</button>');
}
function light(i,ms){const el=$('pad'+i);if(!el)return;el.classList.add('lit');tone(PADS[i].f,.5,.12);later(()=>el.classList.remove('lit'),ms);}
function playSeq(){
  const s=G.seq;
  s.forEach((v,i)=>later(()=>light(v,650),900+i*1000));
  later(()=>{G.pos=0;advance('input');},900+s.length*1000);
}
function seqNextRound(){
  if(G.round>=SEQ_ROUNDS-1){advance('done');return;}
  G.round++;G.fails=0;newSeq();advance('watch');
}

  G.cards=shuffle(cards);G.sel=[];G.lock=false;G.peek=false;G.miss=0;G.n=n;
}
function viewMatch(){
  if(G.step==='intro')return shell('brain','準備','<div class="card"><p style="margin:0">每個節慶，都有它的食物或習俗。請翻開兩張牌，如果能配成一對，牌就會留下來。</p>'+
    '<ul class="plain"><li>例如「粽子」和「端午節」是一對</li><li>忘記位置可以按「看一眼全部」</li><li>沒有時間限制</li></ul></div><button class="btn wide" data-act="mtStart">開始</button>');

  const cs=G.cards.map((c,i)=>{
    const face=c.s!=='down'||G.peek;

  return shell('brain','已配對 '+okN+' / '+G.n,'<div class="cards">'+cs+'</div>'+

}

    if(ch)return '<button class="opt sel" disabled>'+t+'<small>剛剛沒有這個</small></button>';

function pickFrom(bank){
  const lv=getLv(G.key);
  let pool=bank.filter(q=>G.used.indexOf(q)<0);
  const same=pool.filter(q=>q.l===lv);
  if(same.length)pool=same;
  else pool.sort((a,b)=>Math.abs(a.l-lv)-Math.abs(b.l-lv));
  const q=same.length?pool[Math.floor(Math.random()*pool.length)]:pool[0];
  G.used.push(q);return q;
}
function nextQ(){
  const q=pickFrom(G.mode==='fest'?FEST:HEALTH);
  G.q={q:q.q,a:q.o[0],opts:shuffle(q.o),h:q.h};G.ok=false;G.picked=null;G.first=true;
}
function nextOrder(){
  const s=pickFrom(ORDERS);
  G.seq=s;G.items=shuffle(s.s.map((_,i)=>i));G.placed=[];G.miss=0;G.fb='';
}

  if(G.step==='done')return doneCard('cog','5 題都完成了。動腦就像散步，每天一點點最有效。');

  const opts=q.opts.map((o,i)=>{
    const cls='opt'+(G.ok&&o===q.a?' right':(G.picked===o&&!G.ok?' sel':''));
    return '<button class="'+cls+'" data-act="ans" data-v="'+i+'"'+(G.ok?' disabled':'')+'>'+o+'</button>';}).join('');
  let fb='';
  if(G.ok)fb='<p class="fb">答對了，答案是「'+q.a+'」。</p>';
  else if(G.picked!==null)fb='<p class="fb">再想一想：'+q.h+'可以再選一次。</p>';
  return shell('cog','第 '+(G.n+1)+' / 5 題','<div class="card"><p style="margin:0;font-weight:700">'+q.q+'</p></div>'+
    '<div class="grid2 stack">'+opts+'</div>'+fb+
    (G.ok?'<button class="btn wide" data-act="cNext">'+(G.n===4?'完成':'下一題')+'</button>':''));
}
function viewOrder(){
  if(G.step==='done')return doneCard('cog','3 組步驟都排好了。生活中的事，一步一步來就不會亂。');

  return shell('cog','第 '+(G.n+1)+' / 3 組','<div class="card"><p style="margin:0;font-weight:700">「'+s.n+'」要怎麼做？請照順序，一個一個點。</p>'+

  if(k==='mind'){g.rated=null;
    if(id==='weather'){g.step='pick';g.w=null;g.n=0;}
    if(id==='scan'){g.step='go';g.i=0;}
    if(id==='thanks'){g.step='pick';g.t=[];}}
  if(id==='seq'){g.round=0;g.len=0;g.seq=[];g.pos=0;g.fails=0;g.best=0;}
  if(id==='match'){g.cards=[];}
  if(id==='items'){g.round=0;}
  if(id==='fest'||id==='health'){g.step='q';g.used=[];g.n=0;}
  if(id==='order'){g.step='q';g.used=[];g.n=0;}
  return g;
}
function startMode(k,id){
  stopAll();G=initMode(k,id);
  if(id==='fest'||id==='health')nextQ();
  if(id==='order')nextOrder();
  if(id==='match')initMatch();
  if(id==='items'){newItems();G.step='memo';}
  render();scrollTop();
}
function advance(s){G.step=s;render();scrollTop();}
function render(){
  const ae=document.activeElement;let sig=null;
  if(ae&&app.contains(ae)&&ae.dataset&&ae.dataset.act)sig=[ae.dataset.act,ae.dataset.v];
  app.innerHTML=current==='home'?viewHome():(!G.mode?viewPicker(current):VIEWS[current+'.'+G.mode]());
  let el=null;
  if(sig)el=Array.from(app.querySelectorAll('[data-act]')).find(x=>x.dataset.act===sig[0]&&x.dataset.v===sig[1]&&!x.disabled);
  if(!el&&kb)el=app.querySelector('.btn.wide:not(:disabled)')||app.querySelector('.tile')||app.querySelector('.opt:not(:disabled)')||app.querySelector('button:not(:disabled)');
  if(el){try{el.focus({preventScroll:true});}catch(e){}}
  if(current==='body'&&G.step==='breath')startBreath();
  if(current==='brain'&&G.mode==='seq'&&G.step==='watch')playSeq();
  if(current==='cog'&&(G.mode==='fest'||G.mode==='health')&&G.step==='q'&&!G.ok&&G.picked===null)speak(G.q.q);
  if(current==='mind'&&G.mode==='scan'&&G.step==='go')speak(SCAN[SCAN_IDX[getLv(G.key)][G.i]].t);
  musicSync();
}
function enter(view){
  stopAll();current=view;G={mode:null};render();scrollTop();
  const h=app.querySelector('h1,h2');if(h){h.setAttribute('tabindex','-1');if(!kb){try{h.focus({preventScroll:true});}catch(e){}}}
}
function updateMusicButtons(){
  document.querySelectorAll('[data-act="set"][data-v="music"]').forEach(b=>{
    b.textContent=musicLabel(!!b.dataset.s);b.setAttribute('aria-pressed',String(store.settings.music));});
}

app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  gesture=true;if(store.settings.music)musicSync();
  const a=t.getAttribute('data-act'),v=t.getAttribute('data-v');
  switch(a){
    case 'open':enter(v);break;
    case 'home':enter('home');break;
    case 'mode':startMode(current,v);break;
    case 'again':startMode(current,G.mode);break;
    case 'switch':stopAll();G={mode:null};render();scrollTop();break;
    case 'rate':{
      const lv=getLv(G.key);G.rated=v;
      if(v==='up')setLv(G.key,lv+1);else if(v==='down')setLv(G.key,lv-1);
      render();break;}
    case 'set':
      if(v==='size'){store.settings.size={m:'xl',xl:'tv',tv:'m'}[store.settings.size]||'xl';applySize();persist();render();break;}
      store.settings[v]=!store.settings[v];
      if(v==='sound'&&store.settings.sound)tone(392,.4,.1);
      if(v==='voice'&&store.settings.voice)speak('語音朗讀已開啟');
      if(v==='music'){persist();musicSync();updateMusicButtons();break;}
      persist();render();break;
    /* body */
    case 'bStart':tone(392,.4,.1);advance('breath');break;
    case 'bRep':G.reps++;tone(330+G.reps*30,.3,.1);render();break;
    case 'bNext':
      if(G.mi===movesList().length-1)advance('done');else{G.mi++;G.reps=0;render();scrollTop();}
      break;
    /* mind */
    case 'mW':G.w=Number(v);tone(330,.3,.08);render();break;
    case 'mBreath':G.n++;tone(262,.8,.08);render();break;
    case 'mT':{const ix=Number(v),p=G.t.indexOf(ix);if(p>=0)G.t.splice(p,1);else G.t.push(ix);tone(392,.3,.08);render();break;}
    case 'mNext':advance(G.mode==='weather'&&G.step==='pick'?'breath':'done');break;
    case 'sNext':
      if(G.i>=SCAN_IDX[getLv(G.key)].length-1)advance('done');else{G.i++;render();scrollTop();}
      break;
    /* brain: sequence */
    case 'brStart':G.round=0;G.fails=0;G.len=[2,3,4][getLv(G.key)-1];newSeq();advance('watch');break;
    case 'brAgain':G.pos=0;advance('watch');break;
    case 'brSkip':adapt(false);G.len=Math.max(2,G.len-1);seqNextRound();break;
    case 'brNext':seqNextRound();break;
    case 'pad':{
      if(G.step!=='input')return;
      const i=Number(v);light(i,350);
      if(i===G.seq[G.pos]){
        G.pos++;
        if(G.pos===G.seq.length){
          G.step='lock';
          later(()=>{G.best=Math.max(G.best,G.seq.length);adapt(G.fails===0);if(G.fails===0)G.len=Math.min(6,G.len+1);advance('ok');tone(523,.5,.1);},800);
        }else{const st=$('st');if(st)st.textContent='輪到您了，請照順序按（已按 '+G.pos+' / '+G.seq.length+'）';}
      }else{G.fails++;G.step='lock';later(()=>advance('retry'),600);}
      break;}
    /* brain: match */
    case 'mtStart':advance('play');break;
    case 'card':{
      const i=Number(v),c=G.cards[i];
      if(G.lock||G.peek||c.s!=='down')return;
      c.s='up';G.sel.push(i);tone(392,.2,.08);
      if(G.sel.length===2){
        const x=G.cards[G.sel[0]],y=G.cards[G.sel[1]];
        if(x.id===y.id){
          x.s='ok';y.s='ok';G.sel=[];tone(523,.5,.1);
          if(G.cards.every(z=>z.s==='ok')){
            const lv=getLv(G.key);
            if(G.miss<=1)setLv(G.key,lv+1);else if(G.miss>=G.n*2)setLv(G.key,lv-1);
            render();later(()=>advance('done'),900);return;
          }
          render();
        }else{
          G.miss++;G.lock=true;render();
          later(()=>{G.cards[G.sel[0]].s='down';G.cards[G.sel[1]].s='down';G.sel=[];G.lock=false;render();},1400);
        }
      }else render();
      break;}
    case 'peek':G.peek=true;render();later(()=>{G.peek=false;render();},2500);break;
    /* brain: items */
    case 'itGo':advance('choose');break;
    case 'itPick':{
      const p=G.sel.indexOf(v);
      if(p>=0)G.sel.splice(p,1);else if(G.sel.length<G.n)G.sel.push(v);
      tone(392,.2,.08);render();break;}
    case 'itCheck':{
      const right=G.sel.filter(x=>G.target.indexOf(x)>=0).length;
      adapt(right===G.n);tone(right===G.n?523:330,.5,.1);advance('result');break;}
    case 'itNext':
      if(G.round>=ITEM_ROUNDS-1)advance('done');else{G.round++;newItems();advance('memo');}
      break;
    /* cognition: multiple choice */
    case 'ans':{
      const q=G.q,o=q.opts[Number(v)];G.picked=o;
      if(o===q.a){G.ok=true;adapt(G.first);tone(523,.5,.1);speak('答對了');}
      else{if(G.first){G.first=false;adapt(false);}tone(220,.4,.06);}
      render();break;}
    case 'cNext':
      if(G.n>=4)advance('done');else{G.n++;nextQ();render();scrollTop();}
      break;
    /* cognition: ordering */
    case 'oPick':{
      const i=Number(v);
      if(i===G.placed.length){G.placed.push(i);G.fb='';tone(392+G.placed.length*40,.3,.1);
        if(G.placed.length===G.seq.s.length){adapt(G.miss===0);tone(523,.5,.1);}}
      else{G.miss++;G.fb='再想一想，第 '+(G.placed.length+1)+' 步會是什麼？';tone(220,.4,.06);}
      render();break;}
    case 'oNext':
      if(G.n>=2)advance('done');else{G.n++;nextOrder();render();scrollTop();}
      break;
  }
});

/* ---------- keyboard / TV remote ---------- */
document.addEventListener('keydown',e=>{
  kb=true;gesture=true;
  if((e.key==='Escape'||e.key==='Backspace')&&current!=='home'){e.preventDefault();enter('home');return;}
  const dirs={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]};
  const d=dirs[e.key];if(!d)return;
  const btns=Array.from(app.querySelectorAll('button:not(:disabled)')).filter(b=>b.offsetParent!==null);
  if(!btns.length)return;
  const cur=document.activeElement;
  if(btns.indexOf(cur)<0){e.preventDefault();btns[0].focus();return;}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=1e9;
  btns.forEach(b=>{
    if(b===cur)return;
    const q=b.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
    const along=dx*d[0]+dy*d[1];if(along<=4)return;
    const across=Math.abs(dx*d[1])+Math.abs(dy*d[0]);
    const s=along+across*2.2;if(s<bs){bs=s;best=b;}
  });
  if(best){e.preventDefault();best.focus();try{best.scrollIntoView({block:'nearest'});}catch(x){}}
});
document.addEventListener('pointerdown',()=>{kb=false;});

enter('home');
})();
</script>
