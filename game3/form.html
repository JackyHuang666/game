<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MindFlow｜專注 × 放鬆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap">
<style>
/* 版面概念：左對齊的首頁（呼吸光球 + 兩組遊戲卡片 + 紀錄儀表板）；遊戲頁為單一大舞台，控制列固定在舞台下方。
   視覺：深藍夜色為底，湖水綠負責「專注」，柔和紫負責「放鬆」。單一深色主題（刻意不做淺色版）。 */
:root {
  --ink: #050c1d;
  --navy: #0a1a3a;
  --deep: #10264f;
  --teal: #3fd6c4;
  --teal-2: #62c6ee;
  --violet: #a999f2;
  --violet-2: #b7a6ff;
  --text: #e9f2fc;
  --muted: #94a9c8;
  --line: rgba(173, 205, 255, 0.14);
  --panel: rgba(255, 255, 255, 0.045);
  --panel-2: rgba(255, 255, 255, 0.08);
  --f-display: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --f-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --f-num: 'Outfit', 'Noto Sans TC', system-ui, sans-serif;
  --r-lg: 28px;
  --r-md: 20px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--ink); }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 400 17px/1.75 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
/* 柔和光影背景 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(60vmax 50vmax at 8% -10%, rgba(63, 214, 196, 0.16), transparent 60%),
    radial-gradient(55vmax 45vmax at 100% 8%, rgba(169, 153, 242, 0.17), transparent 60%),
    radial-gradient(70vmax 50vmax at 50% 120%, rgba(34, 92, 160, 0.3), transparent 60%),
    linear-gradient(180deg, #060e22 0%, #0a1a3a 100%);
}
h1, h2, h3, h4, p, ul, ol, dl, dd, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.app { max-width: 1120px; margin: 0 auto; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
b, strong { font-weight: 600; }

:focus-visible { outline: 3px solid var(--violet-2); outline-offset: 3px; border-radius: 10px; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 13px/1.4 var(--f-num);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--teal);
}
.lead { color: var(--muted); font-size: 17px; max-width: 34em; }

/* ---------- 按鈕 ---------- */
.btn {
  min-height: 52px; padding: 0 26px; border-radius: 999px;
  border: 1px solid transparent; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: 17px; line-height: 1.2;
  transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease, opacity 0.2s;
  -webkit-user-select: none; user-select: none;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, #46e0cc, var(--teal-2) 55%, var(--violet-2));
  color: #06152b;
  box-shadow: 0 8px 28px rgba(63, 214, 196, 0.25);
}
.btn-primary:hover:not(:disabled) { box-shadow: 0 10px 34px rgba(98, 198, 238, 0.4); transform: translateY(-1px); }
.btn-soft { background: var(--panel-2); border-color: var(--line); color: var(--text); }
.btn-soft:hover:not(:disabled) { background: rgba(255, 255, 255, 0.13); }
.btn-ghost { background: transparent; color: var(--muted); min-height: 44px; padding: 0 14px; border-radius: 14px; gap: 6px; font-weight: 500; }
.btn-ghost:hover { color: var(--text); background: var(--panel); }
.btn-lg { min-height: 58px; padding: 0 40px; font-size: 18px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

/* ---------- 首頁 Hero ---------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 24px; align-items: center; padding-block: 28px 44px;
}
.brand { color: var(--text); font-size: 15px; letter-spacing: 0.18em; }
.brand svg { color: var(--teal); }
.hero h1 {
  font: 700 clamp(46px, 8vw, 84px)/1.05 var(--f-display);
  margin: 14px 0 10px; letter-spacing: 0.02em;
  background: linear-gradient(120deg, #eaf7ff 10%, var(--teal) 55%, var(--violet) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero h1 em { font-style: normal; font-weight: 400; margin-inline: 0.12em; }
.motto { font: 500 clamp(20px, 3vw, 26px)/1.5 var(--f-display); color: var(--text); margin-bottom: 14px; }
.today { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 26px; color: var(--muted); font-size: 15px; }
.today b { font: 600 22px/1 var(--f-num); color: var(--text); margin-right: 6px; font-variant-numeric: tabular-nums; }

.hero-orb { position: relative; width: min(100%, 340px); aspect-ratio: 1; justify-self: center; display: grid; place-items: center; }
.hero-orb i { position: absolute; border-radius: 50%; animation: breathe 10s ease-in-out infinite; }
.hero-orb .o1 { inset: 30%; background: radial-gradient(circle at 35% 30%, #d9fff8, var(--teal) 55%, #1f8f9a); box-shadow: 0 0 60px rgba(63, 214, 196, 0.55); }
.hero-orb .o2 { inset: 14%; border: 1.5px solid rgba(98, 198, 238, 0.45); animation-delay: -0.4s; }
.hero-orb .o3 { inset: 0; border: 1.5px solid rgba(169, 153, 242, 0.4); background: radial-gradient(circle, rgba(169, 153, 242, 0.14), transparent 68%); animation-delay: -0.8s; }
.hero-orb span { position: absolute; bottom: 4%; font: 500 13px var(--f-num); letter-spacing: 0.2em; color: var(--muted); }
@keyframes breathe { 0%, 100% { transform: scale(0.84); } 40% { transform: scale(1.06); } }

/* ---------- 遊戲分組與卡片 ---------- */
.group { margin-top: 20px; }
.sec-head { display: grid; gap: 6px; margin-bottom: 18px; }
.sec-head h2 { font: 600 clamp(22px, 3vw, 28px)/1.4 var(--f-display); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.card {
  position: relative; display: flex; flex-direction: column; text-align: left; cursor: pointer;
  border-radius: var(--r-lg); border: 1px solid var(--line); padding: 0; overflow: hidden; min-width: 0;
  background: linear-gradient(165deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
  transition: transform 0.25s ease, border-color 0.25s, box-shadow 0.25s;
}
.card:hover { transform: translateY(-4px); border-color: rgba(98, 198, 238, 0.5); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35); }
.card-tracking { background: linear-gradient(165deg, rgba(63, 214, 196, 0.17), rgba(16, 38, 79, 0.55)); }
.card-mandala { background: linear-gradient(165deg, rgba(169, 153, 242, 0.2), rgba(16, 38, 79, 0.55)); }
.card-weather { background: linear-gradient(165deg, rgba(169, 153, 242, 0.16), rgba(63, 214, 196, 0.1) 70%, rgba(16, 38, 79, 0.5)); }
.card-breath { background: linear-gradient(165deg, rgba(62, 130, 220, 0.24), rgba(63, 214, 196, 0.1) 70%, rgba(16, 38, 79, 0.5)); }
.card-body { padding: 18px 22px 22px; display: grid; gap: 8px; }
.card h3 { font: 600 24px/1.3 var(--f-display); }
.card p { color: var(--muted); font-size: 16px; line-height: 1.65; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 4px; font-size: 14px; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; color: var(--text); background: var(--panel); }
.done-count { color: var(--teal); }
.card-go { position: absolute; top: 16px; right: 18px; font: 600 14px var(--f-num); letter-spacing: 0.06em; color: var(--text); background: rgba(5, 12, 29, 0.55); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; }

.art { height: 168px; position: relative; display: grid; place-items: center; overflow: hidden; }
.art-track .art-orbit { position: absolute; width: 62%; height: 54%; border: 1px dashed rgba(98, 198, 238, 0.28); border-radius: 50%; }
.art-track .art-orb { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #7cf0e0 60%, #26b9a8); box-shadow: 0 0 26px 8px rgba(63, 214, 196, 0.5); animation: orbit 9s linear infinite; }
.art-track .art-ring { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(196, 182, 255, 0.8); animation: orbit 9s linear infinite; animation-delay: -0.45s; }
@keyframes orbit {
  0% { transform: translate(110px, 0); } 25% { transform: translate(0, 38px); }
  50% { transform: translate(-110px, 0); } 75% { transform: translate(0, -38px); } 100% { transform: translate(110px, 0); }
}
.art-mandala svg, .art-breath svg { width: 100%; height: 100%; }
.spin-a { animation: spin 40s linear infinite; }
.spin-b { animation: spin 60s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.art-weather { background: radial-gradient(60% 80% at 50% 100%, rgba(169, 153, 242, 0.22), transparent); }
.sea { animation: sway 7s ease-in-out infinite alternate; }
.sea-2 { animation-duration: 5.5s; animation-delay: -2s; }
.sea-1 { animation-duration: 4.2s; animation-delay: -1s; }
@keyframes sway { from { transform: translateX(0); } to { transform: translateX(-50px); } }

/* ---------- 紀錄 ---------- */
.records { margin-top: 64px; }
.rec-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.panel { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-lg); padding: 22px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 16px; }
.panel-head h3 { font: 600 20px/1.4 var(--f-display); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; height: 220px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.wk-val { font: 500 12px/18px var(--f-num); color: var(--teal); height: 18px; white-space: nowrap; }
.wk-track { flex: 1; width: 100%; max-width: 44px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: flex-end; overflow: hidden; }
.wk-track i { display: block; width: 100%; border-radius: 12px; background: linear-gradient(180deg, var(--teal), #3a8fd0 70%, var(--violet)); transition: height 0.6s ease; }
.wk-day { font-size: 13px; line-height: 1.3; color: var(--muted); }
.wk-date { font: 500 12px/1 var(--f-num); color: var(--muted); opacity: 0.7; }
.wk.today .wk-day { color: var(--text); font-weight: 600; }
.wk.today .wk-track { outline: 1.5px solid rgba(63, 214, 196, 0.5); outline-offset: 2px; }
.totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.totals dt, .summary dt { font-size: 13px; color: var(--muted); }
.totals dd { font: 600 24px/1.3 var(--f-num); font-variant-numeric: tabular-nums; }
.totals dd small { font: 400 14px var(--f-body); color: var(--muted); }
.by-game li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.by-game li:last-child { border-bottom: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; grid-row: 1 / span 2; }
.dot-focus { background: var(--teal); box-shadow: 0 0 10px var(--teal); }
.dot-relax { background: var(--violet); box-shadow: 0 0 10px var(--violet); }
.bg-name { font-weight: 600; }
.bg-n { font: 600 16px var(--f-num); text-align: right; }
.bg-t { grid-column: 2 / span 2; font-size: 14px; color: var(--muted); }
.day + .day { margin-top: 18px; }
.day h4 { font: 600 16px var(--f-body); margin-bottom: 6px; }
.day h4 span { color: var(--muted); font-weight: 400; font-size: 14px; }
.day li { display: grid; grid-template-columns: 56px minmax(0, auto) minmax(0, 1fr) auto; gap: 4px 14px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; }
.day time { font: 500 15px var(--f-num); color: var(--muted); font-variant-numeric: tabular-nums; }
.day .dur { font: 500 15px var(--f-num); color: var(--teal); text-align: right; }
.empty { padding: 24px 0 8px; }
.clear { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
.foot { margin-top: 56px; text-align: left; color: var(--muted); font-size: 14px; opacity: 0.8; }

/* ---------- 遊戲頁 ---------- */
.game { display: grid; gap: 16px; }
.game-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.game-head > :first-child { justify-self: start; }
.game-head > :last-child { justify-self: end; }
.game-title { text-align: center; }
.game-title h2 { font: 700 clamp(22px, 4vw, 30px)/1.3 var(--f-display); }
.stage {
  position: relative; height: clamp(460px, 70vh, 700px); border-radius: var(--r-lg); overflow: hidden;
  border: 1px solid var(--line);
  background: radial-gradient(90% 70% at 50% 0%, rgba(63, 214, 196, 0.08), transparent 70%), linear-gradient(180deg, #081633, #0a1f46);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.stage-flow { height: auto; min-height: 560px; }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.controls .btn { min-width: 150px; }

.cv-wrap { position: absolute; inset: 0; }
.cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.track .cv { cursor: none; }

.hud { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; padding: 16px 20px; gap: 10px; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hud-main { font: 500 30px/1 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.hud-side { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hud-side b { font: 600 20px var(--f-num); color: var(--text); }
.bar { height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--violet)); transition: width 1s linear; }
.hud-hint { margin-top: auto; align-self: center; text-align: center; font-size: 16px; color: var(--text); background: rgba(5, 12, 29, 0.55); backdrop-filter: blur(6px); border: 1px solid var(--line); padding: 6px 18px; border-radius: 999px; }
.pills { display: inline-flex; gap: 6px; flex-wrap: wrap; font-family: var(--f-body); }
.pill { font: 500 14px/1 var(--f-body); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.on { color: #06152b; background: linear-gradient(135deg, var(--teal), var(--violet-2)); border-color: transparent; font-weight: 600; }
.pill.ok { color: var(--teal); border-color: rgba(63, 214, 196, 0.45); }

/* 覆蓋層 */
.overlay { position: absolute; inset: 0; z-index: 5; display: grid; padding: 16px; overflow: auto; background: rgba(5, 12, 29, 0.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.overlay-done { background: rgba(5, 12, 29, 0.5); }
.sheet { margin: auto; width: min(100%, 520px); display: grid; gap: 14px; justify-items: start; padding: 28px; border-radius: 26px; background: linear-gradient(170deg, rgba(20, 40, 82, 0.92), rgba(10, 24, 54, 0.92)); border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45); }
.sheet-sm { width: min(100%, 420px); }
.sheet h3 { font: 700 28px/1.3 var(--f-display); }
.steps { counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; position: relative; padding-left: 40px; line-height: 1.6; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 14px var(--f-num); color: var(--teal); border: 1px solid rgba(63, 214, 196, 0.5); }
.praise { font: 500 20px/1.75 var(--f-display); color: var(--text); }
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; width: 100%; padding-block: 14px; border-block: 1px solid var(--line); }
.summary dd { font: 600 20px/1.4 var(--f-num); }

/* 光點追蹤 */
.mandala-wrap { position: absolute; inset: 92px 14px 64px; }
.mandala { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; touch-action: manipulation; }
.m-halo { fill: none; stroke: rgba(173, 205, 255, 0.1); stroke-width: 1; }
.m-halo2 { stroke-dasharray: 2 7; }
.m-ghost line { stroke: rgba(173, 205, 255, 0.1); stroke-width: 1.2; }
.m-edge { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.m-node { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.m-hit { fill: transparent; }
.m-dot { fill: rgba(190, 215, 255, 0.4); transition: r 0.2s; }
.m-node.next .m-dot { filter: drop-shadow(0 0 6px currentColor); }
.m-node.cur .m-dot { stroke: #fff; stroke-width: 2; }
.m-node:focus-visible .m-dot { stroke: #fff; stroke-width: 2.5; }
.m-pulse { fill: rgba(255, 255, 255, 0.06); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 1.5s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(0.7); opacity: 1; } 100% { transform: scale(2.3); opacity: 0; } }
.m-node.wrong .m-dot { fill: var(--violet); animation: shake 0.4s; transform-box: fill-box; transform-origin: center; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.mandala.bloom { animation: bloom 1.5s ease-in-out; }
@keyframes bloom { 0% { transform: scale(1); filter: brightness(1); } 40% { transform: scale(1.05) rotate(4deg); filter: brightness(1.5) saturate(1.2); } 100% { transform: scale(1); filter: brightness(1); } }
.m-final { transform-origin: 200px 200px; animation: spin 120s linear infinite; }

/* 情緒氣象台 */
.wx-stage { position: relative; padding: 28px 28px 32px; min-height: 560px; display: grid; }
.wx-step { display: grid; gap: 22px; align-content: start; }
.wx-head { display: grid; gap: 6px; }
.wx-head h3 { font: 700 clamp(24px, 4vw, 32px)/1.35 var(--f-display); }
.wx-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.wx-card { display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center; padding: 16px 10px 18px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--panel); cursor: pointer; transition: transform 0.2s, border-color 0.2s, background 0.2s; min-width: 0; }
.wx-card:hover { transform: translateY(-3px); background: var(--panel-2); }
.wx-card strong { font: 600 20px/1.4 var(--f-display); }
.wx-card span { font-size: 14px; line-height: 1.5; color: var(--muted); }
.wx-card.on { border-color: var(--teal); background: rgba(63, 214, 196, 0.1); box-shadow: 0 0 0 4px rgba(63, 214, 196, 0.12), 0 12px 34px rgba(63, 214, 196, 0.15); }
.wx-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.wx-chosen { display: flex; align-items: center; gap: 14px; }
.wx-chosen strong { display: block; font: 700 24px/1.3 var(--f-display); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); cursor: pointer; font-size: 17px; transition: background 0.2s, border-color 0.2s; }
.chip:hover { background: var(--panel-2); }
.chip.on { background: rgba(169, 153, 242, 0.22); border-color: var(--violet); color: #fff; font-weight: 600; }
.field { display: grid; gap: 8px; max-width: 520px; }
.field span { font-size: 15px; color: var(--muted); }
.field input { min-height: 52px; padding: 0 18px; border-radius: 16px; border: 1.5px solid var(--line); background: rgba(255, 255, 255, 0.06); font-size: 17px; width: 100%; }
.field input::placeholder { color: rgba(148, 169, 200, 0.6); }
.field input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(63, 214, 196, 0.15); }
.wx-scene { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; }
.wx-scene h3 { font: 700 34px/1.3 var(--f-display); }
.quote { border-left: 3px solid var(--violet); padding: 6px 0 6px 22px; display: grid; gap: 10px; max-width: 40em; }
.quote p:first-of-type { font: 500 clamp(21px, 3vw, 26px)/1.7 var(--f-display); }
.quote-sub { color: var(--muted); }
.wx { overflow: visible; flex: none; }
.wx-rays { transform-origin: 60px 50px; animation: spin 24s linear infinite; }
.wx-glow { animation: glow 4s ease-in-out infinite; transform-origin: 60px 50px; }
@keyframes glow { 50% { transform: scale(1.15); opacity: 0.28; } }
.wx-drift-a { animation: drift 6s ease-in-out infinite alternate; }
.wx-drift-b { animation: drift 8s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translateX(-6px); } to { transform: translateX(8px); } }
.wx-drop { animation: fall 1.1s linear infinite; }
@keyframes fall { 0% { transform: translateY(-4px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(16px); opacity: 0; } }
.wx-arc { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease-out forwards; }
.wx-bolt { animation: flash 2.4s infinite; transform-origin: 62px 74px; }
@keyframes flash { 0%, 55%, 100% { opacity: 0.25; } 60%, 70% { opacity: 1; } 65% { opacity: 0.4; } }

/* 海浪呼吸 */
.breath-ring { position: absolute; left: 50%; top: 58%; width: 148px; height: 148px; border-radius: 50%; transform: translate(-50%, -50%); display: grid; place-content: center; text-align: center; background: rgba(5, 12, 29, 0.32); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); border: 1.5px solid rgba(214, 255, 250, 0.55); box-shadow: 0 0 40px rgba(63, 214, 196, 0.35), inset 0 0 28px rgba(63, 214, 196, 0.18); pointer-events: none; z-index: 1; }
.breath-word { font: 700 30px/1.2 var(--f-display); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); }
.breath-num { font: 500 22px/1.2 var(--f-num); color: #bff6ee; font-variant-numeric: tabular-nums; }

/* ---------- 響應式 ---------- */
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; padding-block: 12px 28px; }
  .hero-orb { width: min(64vw, 260px); justify-self: start; order: -1; margin-bottom: -6px; }
  .rec-grid { grid-template-columns: 1fr; }
  .wx-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  body { font-size: 16.5px; }
  .cards { grid-template-columns: 1fr; }
  .art { height: 150px; }
  @keyframes orbit { 0% { transform: translate(80px, 0); } 25% { transform: translate(0, 34px); } 50% { transform: translate(-80px, 0); } 75% { transform: translate(0, -34px); } 100% { transform: translate(80px, 0); } }
  .game-head { grid-template-columns: auto 1fr auto; }
  .game-head .btn span { display: none; }
  .game-head .btn { padding: 0 12px; }
  .game-title { order: 0; }
  .stage { height: clamp(480px, 72vh, 640px); }
  .stage.stage-flow { height: auto; min-height: 600px; }
  .hud { padding: 14px 14px; }
  .hud-main { font-size: 26px; }
  .pill { padding: 7px 10px; font-size: 13px; }
  .sheet { padding: 22px; }
  .controls .btn { flex: 1 1 140px; }
  .wx-stage { padding: 20px 16px 24px; }
  .wx-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wx-grid > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .day li { grid-template-columns: 52px minmax(0, 1fr) auto; }
  .day li .muted { grid-column: 2 / span 2; grid-row: 2; font-size: 14px; }
  .totals dd { font-size: 20px; }
  .week { gap: 4px; }
  .breath-ring { width: 120px; height: 120px; }
  .breath-word { font-size: 25px; }
  .mandala-wrap { inset: 84px 4px 60px; }
}
@media (prefers-reduced-motion: reduce) {
  .hero-orb i, .spin-a, .spin-b, .sea, .art-orb, .art-ring, .wx-rays, .wx-glow, .wx-drift-a, .wx-drift-b, .wx-bolt, .m-final { animation: none; }
  .card, .btn { transition: none; }
}

.snd { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--text); background: rgba(5, 12, 29, 0.5); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.snd:hover { background: rgba(255, 255, 255, 0.14); }
.snd[aria-pressed='false'] { color: var(--muted); }
